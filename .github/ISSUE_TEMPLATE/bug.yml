name: バグ報告
description: 不具合の報告
title: "[fix] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 立てるときは「概要」だけでよい。わかる範囲で他の欄も書く。
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きているか（ざっくりでよい）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      value: |
        1. 
        2. 
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      description: 着手するときに担当者が書き足す
  - type: textarea
    id: note
    attributes:
      label: 備考
      description: スクリーンショット、エラーメッセージ、環境など
