# PR を出したときと develop が更新されたときに、コードのチェックを自動で行う。
# ビルドが通るかは Vercel が PR ごとに確かめているので、ここでは行わない。
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# 同じ PR に続けて push したときは、古いほうの実行を止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint・型チェック・書式チェック
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: lint（npm run lint）
        run: npm run lint

      - name: 型チェック（npm run typecheck）
        run: npm run typecheck

      - name: 書式チェック（npm run format:check）
        run: npm run format:check
